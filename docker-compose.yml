services:
  picflow:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GOPROXY: "${GOPROXY:-https://proxy.golang.org,direct}"
    image: "${PICFLOW_IMAGE:-picflow:latest}"
    container_name: "${PICFLOW_CONTAINER:-picflow}"
    restart: unless-stopped
    environment:
      NAME: picflow
      ENV: release
      HOST: 0.0.0.0
      PORT: 8080
      DATA_DIR: /app/data
      WEB_DIR: /app/web
      MAX_UPLOAD_SIZE_MB: "${MAX_UPLOAD_SIZE_MB:-20}"
      WORKER_COUNT: "${WORKER_COUNT:-2}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}"
    ports:
      - "${PICFLOW_PORT:-8080}:8080"
    volumes:
      - picflow-data:/app/data
      - picflow-logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  picflow-data:
  picflow-logs:
