openapi: 3.1.0
info:
  title: PicFlow API
  version: 0.1.0
  description: 电商商品图标准化、尺寸图和模板管理 API。
servers:
  - url: http://localhost:8080
paths:
  /health/live:
    get:
      summary: 存活检查
      responses:
        "200": {description: 服务存活}
  /health/ready:
    get:
      summary: 就绪检查
      responses:
        "200": {description: 数据库可用}
  /api/tasks:
    post:
      summary: 上传图片并创建标准化任务
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [config, files]
              properties:
                config:
                  type: string
                  description: JSON 编码的 ProcessConfig
                files:
                  type: array
                  maxItems: 100
                  items: {type: string, format: binary}
      responses:
        "201": {description: 任务已进入队列}
        "400": {$ref: "#/components/responses/BadRequest"}
  /api/tasks/{taskID}:
    parameters:
      - {$ref: "#/components/parameters/TaskID"}
    get:
      summary: 查询处理任务
      responses:
        "200": {description: 任务详情}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      summary: 删除任务及其文件
      responses:
        "200": {description: 删除成功}
        "409": {description: 任务仍在处理中}
  /api/tasks/{taskID}/assets/{assetID}:
    delete:
      summary: 删除任务中的原图及相关输出
      parameters:
        - {$ref: "#/components/parameters/TaskID"}
        - name: assetID
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200": {description: 删除成功}
  /api/tasks/{taskID}/size-charts:
    post:
      summary: 生成尺寸图
      parameters:
        - {$ref: "#/components/parameters/TaskID"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SizeChartRequest"}
      responses:
        "201": {description: 尺寸图已生成}
  /api/tasks/{taskID}/download.zip:
    get:
      summary: 下载任务全部输出
      parameters:
        - {$ref: "#/components/parameters/TaskID"}
      responses:
        "200":
          description: ZIP 文件
          content:
            application/zip: {schema: {type: string, format: binary}}
  /api/outputs/{outputID}/download:
    get:
      summary: 下载单张输出
      parameters:
        - name: outputID
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: 图片文件
          content:
            image/jpeg: {schema: {type: string, format: binary}}
            image/png: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
  /api/templates:
    get:
      summary: 查询模板列表
      responses:
        "200": {description: 模板列表}
    post:
      summary: 保存自定义模板
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateTemplateRequest"}
      responses:
        "201": {description: 模板已保存}
  /api/templates/{templateID}:
    delete:
      summary: 删除自定义模板
      parameters:
        - name: templateID
          in: path
          required: true
          schema: {type: string}
      responses:
        "200": {description: 删除成功}
        "403": {description: 内置模板不能删除}
components:
  parameters:
    TaskID:
      name: taskID
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Response"}
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Response"}
  schemas:
    Response:
      type: object
      required: [code, msg, data]
      properties:
        code: {type: integer}
        msg: {type: string}
        data: {}
    ProcessConfig:
      type: object
      required: [canvas_width, canvas_height, background, layout_mode, keep_subject_complete, output_format, margin]
      properties:
        template_id: {type: string}
        canvas_width: {type: integer, minimum: 64, maximum: 4096}
        canvas_height: {type: integer, minimum: 64, maximum: 4096}
        background: {type: string, example: "#FFFFFF"}
        layout_mode: {type: string, const: center_fit}
        keep_subject_complete: {type: boolean, const: true}
        output_format: {type: string, enum: [jpeg, png, webp]}
        margin: {type: integer, minimum: 0}
    SizeChartRequest:
      type: object
      required: [asset_id, width, height, unit, template_id]
      properties:
        asset_id: {type: string, format: uuid}
        width: {type: number, exclusiveMinimum: 0}
        height: {type: number, exclusiveMinimum: 0}
        depth: {type: number, minimum: 0}
        unit: {type: string, enum: [cm, mm]}
        template_id: {type: string}
    CreateTemplateRequest:
      type: object
      required: [name, type, config]
      properties:
        name: {type: string, maxLength: 80}
        type: {type: string, enum: [main_image, size_chart]}
        description: {type: string, maxLength: 255}
        config: {type: object}
