openapi: 3.1.0
info:
  title: PicFlow API
  version: 0.2.0
  description: 批量图片规则处理、规格图和模板管理 API，包含可选 Qwen AI 换背景扩展。
servers:
  - url: http://localhost:8080
paths:
  /health/live:
    get:
      summary: 存活检查
      responses:
        "200": {description: 服务存活}
  /health/ready:
    get:
      summary: 就绪检查
      responses:
        "200": {description: 数据库可用}
  /api/tasks:
    post:
      summary: 上传图片并创建标准化任务
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [config, files]
              properties:
                config:
                  type: string
                  description: JSON 编码的 ProcessConfig
                files:
                  type: array
                  maxItems: 100
                  items: {type: string, format: binary}
      responses:
        "201":
          description: 任务已进入队列
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TaskEnvelope"}
        "400": {$ref: "#/components/responses/BadRequest"}
  /api/tasks/{taskID}:
    parameters:
      - {$ref: "#/components/parameters/TaskID"}
    get:
      summary: 查询处理任务
      responses:
        "200":
          description: 任务详情
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TaskEnvelope"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      summary: 删除任务及其文件
      responses:
        "200": {description: 删除成功}
        "409": {description: 任务仍在处理中}
  /api/tasks/{taskID}/assets/{assetID}:
    delete:
      summary: 删除任务中的原图及相关输出
      parameters:
        - {$ref: "#/components/parameters/TaskID"}
        - name: assetID
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200": {description: 删除成功}
  /api/tasks/{taskID}/retry:
    post:
      summary: 重新执行失败任务
      parameters:
        - {$ref: "#/components/parameters/TaskID"}
      responses:
        "200":
          description: 任务已重新进入队列
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TaskEnvelope"}
        "409": {description: 当前任务不是失败状态}
  /api/tasks/{taskID}/size-charts:
    post:
      summary: 生成规格图
      parameters:
        - {$ref: "#/components/parameters/TaskID"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SizeChartRequest"}
      responses:
        "201":
          description: 规格图已生成
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OutputEnvelope"}
  /api/tasks/{taskID}/download.zip:
    get:
      summary: 下载任务全部输出
      parameters:
        - {$ref: "#/components/parameters/TaskID"}
      responses:
        "200":
          description: ZIP 文件
          content:
            application/zip: {schema: {type: string, format: binary}}
  /api/outputs/{outputID}/download:
    get:
      summary: 下载单张输出
      parameters:
        - name: outputID
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: 图片文件
          content:
            image/jpeg: {schema: {type: string, format: binary}}
            image/png: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
  /api/templates:
    get:
      summary: 查询模板列表
      responses:
        "200":
          description: 模板列表
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TemplateListEnvelope"}
    post:
      summary: 保存自定义模板
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateTemplateRequest"}
      responses:
        "201":
          description: 模板已保存
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TemplateEnvelope"}
  /api/templates/{templateID}:
    delete:
      summary: 删除自定义模板
      parameters:
        - name: templateID
          in: path
          required: true
          schema: {type: string}
      responses:
        "200": {description: 删除成功}
        "403": {description: 内置模板不能删除}
components:
  parameters:
    TaskID:
      name: taskID
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Response"}
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Response"}
  schemas:
    Response:
      type: object
      required: [code, msg, data]
      properties:
        code: {type: integer}
        msg: {type: string}
        data: {}
    ProcessConfig:
      type: object
      required: [canvas_width, canvas_height, background, layout_mode, keep_subject_complete, output_format, margin_mode, margin, output_quality, replace_simple_background, background_tolerance]
      properties:
        template_id: {type: string}
        canvas_width: {type: integer, minimum: 64, maximum: 4096}
        canvas_height: {type: integer, minimum: 64, maximum: 4096}
        background: {type: string, example: "#FFFFFF"}
        layout_mode: {type: string, enum: [contain, cover-center, cover-top, cover-bottom]}
        keep_subject_complete: {type: boolean, description: contain 模式为 true，cover 模式为 false}
        output_format: {type: string, enum: [jpeg, png, webp]}
        margin_mode: {type: string, enum: [auto, fixed]}
        margin: {type: integer, minimum: 0}
        output_quality: {type: integer, minimum: 30, maximum: 100, description: 当前用于 JPG 有损压缩}
        replace_simple_background: {type: boolean, description: 是否移除从边缘连通的透明或近似纯色背景}
        background_tolerance: {type: integer, minimum: 2, maximum: 30, description: 单一背景颜色容差百分比}
        ai_background: {type: boolean, default: false, description: 调用后端配置的图片编辑模型移除原背景并换色或生成场景，与本地背景替换互斥，不支持透明底}
        ai_background_prompt: {type: string, maxLength: 1000, description: AI 场景描述或换色指令，留空使用 background 指定的纯色；明确换色指令同步画布颜色并进行背景边缘初步校验；AI 原图不得超过 10MB}
        specification:
          allOf:
            - {$ref: "#/components/schemas/TaskSpecification"}
          description: 可选；在标准化后的最终画布上直接绘制规格表格
    TaskSpecification:
      type: object
      required: [specifications, table_position, table_style]
      properties:
        specifications:
          type: array
          minItems: 1
          maxItems: 10
          items: {$ref: "#/components/schemas/Specification"}
        table_position: {$ref: "#/components/schemas/SpecificationTablePosition"}
        table_style: {$ref: "#/components/schemas/SpecificationTableStyle"}
    SizeChartRequest:
      type: object
      required: [asset_id, template_id, specifications, table_position, table_style]
      properties:
        asset_id: {type: string, format: uuid}
        template_id: {type: string}
        specifications:
          type: array
          minItems: 1
          maxItems: 10
          items: {$ref: "#/components/schemas/Specification"}
        table_position: {$ref: "#/components/schemas/SpecificationTablePosition"}
        table_style: {$ref: "#/components/schemas/SpecificationTableStyle"}
    Specification:
      type: object
      required: [label, value]
      properties:
        label: {type: string, minLength: 1, maxLength: 20, example: 宽度}
        value: {type: string, minLength: 1, maxLength: 40, example: 42 cm}
    SpecificationTablePosition:
      type: object
      required: [preset, x, y, width]
      properties:
        preset: {type: string, enum: [top-left, top-right, bottom-left, bottom-right, custom]}
        x: {type: number, minimum: 0, maximum: 1, example: 0.8}
        y: {type: number, minimum: 0, maximum: 1, example: 0.2}
        width: {type: number, minimum: 0.24, maximum: 0.8, example: 0.42}
    SpecificationTableStyle:
      type: object
      required: [style, border_width, border_color, background_color, text_color]
      properties:
        style: {type: string, enum: [simple-table]}
        border_width: {type: integer, minimum: 1, maximum: 8, example: 2}
        border_color: {type: string, pattern: '^#[0-9A-Fa-f]{6}$', example: '#DC2626'}
        background_color: {type: string, description: "transparent 或 #RRGGBB", example: transparent}
        text_color: {type: string, pattern: '^#[0-9A-Fa-f]{6}$', example: '#1F2937'}
    CreateTemplateRequest:
      type: object
      required: [name, type, config]
      properties:
        name: {type: string, maxLength: 80}
        type: {type: string, enum: [main_image, size_chart]}
        description: {type: string, maxLength: 255}
        config: {type: object}
    TaskEnvelope:
      type: object
      required: [code, msg, data]
      properties:
        code: {type: integer, const: 0}
        msg: {type: string}
        data: {$ref: "#/components/schemas/Task"}
    OutputEnvelope:
      type: object
      required: [code, msg, data]
      properties:
        code: {type: integer, const: 0}
        msg: {type: string}
        data: {$ref: "#/components/schemas/Output"}
    TemplateEnvelope:
      type: object
      required: [code, msg, data]
      properties:
        code: {type: integer, const: 0}
        msg: {type: string}
        data: {$ref: "#/components/schemas/Template"}
    TemplateListEnvelope:
      type: object
      required: [code, msg, data]
      properties:
        code: {type: integer, const: 0}
        msg: {type: string}
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: "#/components/schemas/Template"}
    Task:
      type: object
      required: [id, type, status, total_assets, completed_assets, assets, outputs, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        type: {type: string}
        status: {type: string, enum: [queued, processing, succeeded, failed]}
        error_message: {type: string}
        total_assets: {type: integer, minimum: 0}
        completed_assets: {type: integer, minimum: 0}
        assets:
          type: array
          items: {$ref: "#/components/schemas/Asset"}
        outputs:
          type: array
          items: {$ref: "#/components/schemas/Output"}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Asset:
      type: object
      required: [id, task_id, filename, width, height, format, size]
      properties:
        id: {type: string, format: uuid}
        task_id: {type: string, format: uuid}
        filename: {type: string}
        width: {type: integer}
        height: {type: integer}
        format: {type: string}
        size: {type: integer, format: int64}
    Output:
      type: object
      required: [id, task_id, asset_id, type, filename, width, height, format, size, download_url]
      properties:
        id: {type: string, format: uuid}
        task_id: {type: string, format: uuid}
        asset_id: {type: string, format: uuid}
        type: {type: string, enum: [standardized, size_chart]}
        filename: {type: string}
        width: {type: integer}
        height: {type: integer}
        format: {type: string}
        size: {type: integer, format: int64}
        download_url: {type: string}
    Template:
      type: object
      required: [id, name, type, config, built_in]
      properties:
        id: {type: string}
        name: {type: string}
        type: {type: string, enum: [main_image, size_chart]}
        description: {type: string}
        config: {type: object}
        built_in: {type: boolean}
