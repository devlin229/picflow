services:
  app:
    image: "${PUBLISHED_IMAGE:-base-server:latest}"
    container_name: "${DEPLOY_CONTAINER:-base-server}"
    restart: unless-stopped
    labels:
      observability.logs: "true"
    env_file:
      - "${DEPLOY_ENV_FILE:-.env}"
    volumes:
      - logs:/app/logs
    networks:
      - net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${PORT}/health/ready"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

volumes:
  logs:
    name: "${DEPLOY_CONTAINER:-base-server}-logs"

networks:
  net:
    external: true
