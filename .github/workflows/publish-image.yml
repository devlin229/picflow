name: 构建并发布容器镜像

run-name: 发布 GHCR 镜像 ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 镜像标签，例如 latest 或 v1.0.0
        required: true
        default: latest
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: 构建并推送 AMD64 与 ARM64 镜像
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 配置 QEMU
        uses: docker/setup-qemu-action@v4

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签和 OCI 元数据
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=PicFlow
            org.opencontainers.image.description=电商商品图批量处理平台
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      - name: 构建并推送多架构镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=picflow
          cache-to: type=gha,mode=max,scope=picflow
          provenance: mode=max
          sbom: true

      - name: 输出拉取命令
        run: |
          echo "### 镜像发布完成" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull ghcr.io/${GITHUB_REPOSITORY,,}:${{ inputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
